# Παραγωγή — τρέχει στον VPS.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Οι μυστικές τιμές διαβάζονται από αρχείο .env δίπλα σε αυτό το αρχείο.
# Δες DEPLOY.md για τα βήματα.

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Τα αντίγραφα ασφαλείας γράφονται εδώ και τα κατεβάζεις από τον server.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Η βάση δεν εκτίθεται στο internet — μόνο η εφαρμογή τη βλέπει.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      MEDIA_DIR: /app/media
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-ArgolidaStay}
    volumes:
      # Οι φωτογραφίες ζουν εδώ και επιβιώνουν κάθε νέου deploy.
      - media_data:/app/media
    ports:
      # Μόνο τοπικά· μπροστά μπαίνει το Caddy που κάνει HTTPS.
      - '127.0.0.1:3000:3000'

  # Αντίστροφος διακομιστής με αυτόματο πιστοποιητικό HTTPS.
  # Το Caddy βγάζει και ανανεώνει μόνο του το πιστοποιητικό Let's Encrypt.
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  media_data:
  caddy_data:
  caddy_config:
